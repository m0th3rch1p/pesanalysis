plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.yako.sms'
version = '0.0.1'

android {
  namespace "expo.modules.yakosms"
  defaultConfig {
    versionCode 1
    versionName '0.0.1'
  }
}

// HeadlessJsTaskService + WritableMap live in React Native core.
dependencies {
  implementation("com.facebook.react:react-android")
}
